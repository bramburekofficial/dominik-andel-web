<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stránka nenalezena | Dominik Anděl</title>
  <meta name="robots" content="noindex, follow">
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<main class="error-page">
  <div class="error-box">
    <div class="error-badge">404</div>

    <h1>Tahle stránka neexistuje</h1>

    <p>
      Možná byla adresa napsaná špatně, nebo byla stránka přesunuta.
      Vraťte se na hlavní stránku a pokračujte výběrem služeb.
    </p>

    <div class="error-actions">
      <a class="main-btn" href="/">Zpět na hlavní stránku</a>
      <a class="second-btn" href="/#kontakt">Kontaktovat</a>
    </div>
  </div>
</main>


</body>
</html>
